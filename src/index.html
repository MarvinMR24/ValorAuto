<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValorAuto</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }
  .subtitle {
    margin: 0 0 24px;
    color: #94a3b8;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="file"],
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  #preview {
    margin-top: 12px;
    max-width: 100%;
    max-height: 180px;
    border-radius: 8px;
    display: none;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #4f46e5; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    text-align: center;
    display: none;
  }
  .result .price {
    font-size: 28px;
    font-weight: 700;
    color: #4ade80;
  }
  .result .label {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>ValorAuto</h1>
  <p class="subtitle">Sube una foto y el kilometraje para tasar tu auto</p>

  <form id="valorForm">
    <label for="foto">Foto del auto</label>
    <input type="file" id="foto" accept="image/*">
    <img id="preview" alt="Vista previa">

    <label for="km">Kilometraje</label>
    <input type="number" id="km" placeholder="Ej: 45000" min="0">

    <button type="submit">Obtener precio estimado</button>
  </form>

  <div class="result" id="result">
    <div class="price" id="price">$0</div>
    <div class="label">Precio de mercado estimado</div>
  </div>
</div>

<script>
  const form = document.getElementById('valorForm');
  const fotoInput = document.getElementById('foto');
  const preview = document.getElementById('preview');
  const result = document.getElementById('result');
  const price = document.getElementById('price');

  fotoInput.addEventListener('change', () => {
    const file = fotoInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // Demo: valor de ejemplo. Reemplazar con llamada a src/api cuando esté disponible.
    const km = Number(document.getElementById('km').value) || 0;
    const estimado = Math.max(3000, 25000 - km * 0.05);
    price.textContent = '$' + estimado.toLocaleString('es-CL', { maximumFractionDigits: 0 });
    result.style.display = 'block';
  });
</script>

</body>
</html>
